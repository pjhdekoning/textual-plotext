[build-system]
requires = ["uv_build>=0.9.26,<0.12"]
build-backend = "uv_build"

[project]
name = "textual-plotext"
version = "1.0.1"
description = "A Textual widget wrapper for the Plotext plotting library"
homepage = "https://github.com/Textualize/textual-plotext"
repository = "https://github.com/Textualize/textual-plotext"
authors = [
    {name="Dave Pearson", email="dave@textualize.io"}
    ]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Visualization",
    "Typing :: Typed",
]
include = [
    "src/textual_plotext/py.typed",
    "src/textual_plotext/**/*.pyi",
]

dependencies = [
    "plotext>=6.1.0",
    "textual"
    ]

[dependency-groups]
dev = [
    "textual-dev",
    "mypy",
    "pylint",
    "ruff",
    "ty",
]

[tool.ruff]
include = ["src/**/*.py", "examples/**/*.py"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "RUF"]
ignore = ["E741"]

[tool.mypy]
files = ["src", "examples"]
scripts_are_modules = true
mypy_path = "stubs"
